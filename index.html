    <script>
      (function () {
        try {
          var qs = new URLSearchParams(window.location.search);
          var p = qs.get('theme');
          var s = localStorage.getItem('chitrakatha_ui_theme_v1');
          var t = p === 'light' || p === 'dark' ? p : s === 'light' || s === 'dark' ? s : 'dark';
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;

          var lp = (qs.get('lang') || '').toLowerCase();
          var ls = (localStorage.getItem('chitrakatha_ui_lang_v1') || '').toLowerCase();
          var l = lp === 'bn' || lp === 'en' ? lp : ls === 'bn' || ls === 'en' ? ls : 'en';
          document.documentElement.lang = l;
          document.documentElement.dataset.lang = l;
        } catch (e) {}
      })();
    </script>
